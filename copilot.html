<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คู่มือเรียนรู้ Microsoft Copilot สำหรับผู้ใช้งานกลุ่มบริษัท ATTG</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card-bg: #ffffff;
    --text: #1a2634;
    --sub: #5b6b7a;
    --accent: #2b7de9;
    --accent-2: #0f5fc7;
    --border: #e1e8ef;
    --shadow: 0 2px 10px rgba(20, 40, 70, 0.08);
    --pill-bg: #eef3fa;
    --placeholder-bg: #f7f9fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181f;
      --card-bg: #1b232c;
      --text: #eef2f6;
      --sub: #9aa7b4;
      --accent: #5b9dff;
      --accent-2: #3d7fe0;
      --border: #2a3541;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      --pill-bg: #222c37;
      --placeholder-bg: #212a34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Noto Sans Thai", "Sarabun", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--sub); margin: 0 0 24px; font-size: 0.9rem; }

  .layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .topic-list {
    flex: 0 0 240px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .topic-btn {
    text-align: left;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
    font-size: 0.88rem;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .topic-btn:hover { border-color: var(--accent); }
  .topic-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .content {
    flex: 1 1 400px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 24px;
    min-width: 280px;
  }
  .content h2 { margin: 0 0 16px; font-size: 1.2rem; }

  .section-label {
    font-size: 0.75rem;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 8px;
  }

  .key-points {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--pill-bg);
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .key-points-title {
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--accent-2);
    margin-bottom: 8px;
  }
  .key-points ul {
    margin: 0;
    padding-left: 20px;
  }
  .key-points li {
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 4px;
  }
  .key-points li:last-child { margin-bottom: 0; }

  .video-box {
    aspect-ratio: 16 / 9;
    width: 100%;
    border-radius: 12px;
    border: 1px dashed var(--border);
    background: var(--placeholder-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sub);
    font-size: 0.85rem;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .video-box iframe { width: 100%; height: 100%; border: 0; }

  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .image-placeholder {
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    border: 1px dashed var(--border);
    background: var(--placeholder-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sub);
    font-size: 0.78rem;
    text-align: center;
    padding: 8px;
  }
  .image-grid img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .text-block {
    font-size: 0.92rem;
    line-height: 1.7;
    color: var(--text);
  }
  .text-block p { margin: 0 0 12px; }
  .text-block p:last-child { margin-bottom: 0; }
  .text-block.placeholder {
    color: var(--sub);
    font-style: italic;
  }
  .text-block strong { color: var(--accent-2); font-weight: 700; }
  .text-block code, .callout-body code {
    background: var(--pill-bg);
    color: var(--accent-2);
    padding: 1px 6px;
    border-radius: 5px;
    font-family: "Cascadia Code", Consolas, "SFMono-Regular", monospace;
    font-size: 0.88em;
  }

  .flow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 4px 0 16px;
    padding: 16px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--placeholder-bg);
  }
  .flow-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 104px;
    text-align: center;
  }
  .flow-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: var(--pill-bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }
  .flow-label {
    font-size: 0.76rem;
    color: var(--sub);
    font-weight: 600;
    line-height: 1.3;
  }
  .flow-arrow {
    font-size: 1.3rem;
    color: var(--accent);
    flex-shrink: 0;
  }

  .callout {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px 14px;
    border-radius: 10px;
    margin: 0 0 12px;
    font-size: 0.92rem;
    line-height: 1.7;
  }
  .callout:last-child { margin-bottom: 0; }
  .callout-icon { flex-shrink: 0; }
  .callout-label { font-weight: 700; }

  .callout-tip { background: var(--pill-bg); border: 1px solid var(--accent); }
  .callout-tip .callout-label { color: var(--accent); }

  .callout-warn { background: rgba(230, 126, 34, 0.12); border: 1px solid #e08a2e; }
  .callout-warn .callout-label { color: #b5650a; }

  .callout-howto { background: rgba(31, 122, 63, 0.1); border: 1px solid #1f7a3f; }
  .callout-howto .callout-label { color: #1f7a3f; }

  .callout-example { background: rgba(155, 89, 182, 0.1); border: 1px solid #9b59b6; }
  .callout-example .callout-label { color: #8e44ad; }

  @media (prefers-color-scheme: dark) {
    .callout-warn .callout-label { color: #f0a868; }
    .callout-howto .callout-label { color: #5ecb84; }
    .callout-example .callout-label { color: #cfa0e0; }
  }

  .ref-link {
    display: inline-block;
    margin-top: 14px;
    color: var(--accent);
    font-size: 0.85rem;
    text-decoration: none;
  }
  .ref-link:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .topic-list { flex: 1 1 100%; flex-direction: row; overflow-x: auto; }
    .topic-btn { flex: 0 0 auto; white-space: nowrap; }
  }
</style>
</head>

      "วิธีใช้งาน: หาก Copilot ตอบว่า <code>\"ไม่พบข้อมูลที่เกี่ยวข้อง\"</code> ทั้งที่รู้ว่าไฟล์มีอยู่จริง ให้ตรวจสอบว่าตนเองมีสิทธิ์เข้าถึงไฟล์นั้นหรือไม่ และลองระบุชื่อไฟล์ให้ชัดเจนขึ้นด้วยเครื่องหมาย <code>@</code> แทนการถามแบบกว้างๆ",
      "เคล็ดลับ: หากผลลัพธ์ดูคลาดเคลื่อนหรือไม่สมเหตุสมผล ให้ลองเริ่มบทสนทนาใหม่แทนการพิมพ์แก้ไขต่อในเธรดเดิม บางครั้งบริบทเก่าที่สะสมไว้ในบทสนทนายาวๆ อาจทำให้ Copilot ตอบเพี้ยนไปจากที่ตั้งใจ"
    ],
    link: "https://support.microsoft.com/en-us/copilot"
  }
];

const CALLOUT_RULES = [
  { re: /^เคล็ดลับ[^:]*:\s*/, cls: "tip", icon: "💡" },
  { re: /^ข้อควรระวัง[^:]*:\s*/, cls: "warn", icon: "⚠️" },
  { re: /^หมายเหตุ[^:]*:\s*/, cls: "warn", icon: "⚠️" },
  { re: /^วิธี(?:ใช้งาน|สร้าง)[^:]*:\s*/, cls: "howto", icon: "🧩" },
  { re: /^แนวทางที่ดี[^:]*:\s*/, cls: "howto", icon: "🧩" },
  { re: /^ตัวอย่าง[^:]*:\s*/, cls: "example", icon: "📌" }
];

function renderParagraph(text) {
  for (const rule of CALLOUT_RULES) {
    const m = text.match(rule.re);
    if (m) {
      const label = m[0].replace(/:\s*$/, "");
      const rest = text.slice(m[0].length);
      return '<div class="callout callout-' + rule.cls + '">' +
        '<span class="callout-icon">' + rule.icon + '</span>' +
        '<div class="callout-body"><span class="callout-label">' + label + ':</span> ' + rest + '</div>' +
        '</div>';
    }
  }
  return '<p>' + text + '</p>';
}

let currentKey = TOPICS[0].key;

function renderTopicList() {
  const el = document.getElementById("topicList");
  el.innerHTML = "";
  TOPICS.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "topic-btn" + (t.key === currentKey ? " active" : "");
    btn.textContent = t.title;
    btn.onclick = () => {
      currentKey = t.key;
      renderTopicList();
      renderContent();
    };
    el.appendChild(btn);
  });
}

function renderContent() {
  const topic = TOPICS.find(t => t.key === currentKey);
  const el = document.getElementById("content");

  let videoSectionHtml = '';
  if (topic.video) {
    videoSectionHtml = '<div class="section-label">วิดีโอ</div><div class="video-box"><iframe src="' + topic.video + '" allowfullscreen></iframe></div>';
  } else if (topic.keyPoints && topic.keyPoints.length > 0) {
    videoSectionHtml = '<div class="key-points"><div class="key-points-title">✨ ประเด็นสำคัญของหัวข้อนี้</div><ul>' +
      topic.keyPoints.map(k => '<li>' + k + '</li>').join('') +
      '</ul></div>';
  }

  let imagesHtml = '';
  if (topic.images.length > 0) {
    imagesHtml = '<div class="section-label" style="margin-top:20px">ภาพหน้าจอเพิ่มเติม</div><div class="image-grid">' +
      topic.images.map(src => '<img src="' + src + '" alt="">').join('') +
      '</div>';
  }

  const paragraphs = Array.isArray(topic.text) ? topic.text : (topic.text ? [topic.text] : []);
  const paraHtml = paragraphs.map(renderParagraph);
  if (topic.flow && topic.flow.length > 0) {
    const flowHtml = '<div class="flow">' + topic.flow.map((step, i) =>
      '<div class="flow-step"><span class="flow-icon">' + step.icon + '</span><span class="flow-label">' + step.label + '</span></div>' +
      (i < topic.flow.length - 1 ? '<span class="flow-arrow">→</span>' : '')
    ).join('') + '</div>';
    paraHtml.splice(Math.min(1, paraHtml.length), 0, flowHtml);
  }
  const textHtml = paraHtml.length > 0
    ? '<div class="text-block">' + paraHtml.join('') + '</div>'
    : '<div class="text-block placeholder">ยังไม่มีคำอธิบายสำหรับหัวข้อนี้</div>';

  const linkHtml = topic.link
    ? '<a class="ref-link" href="' + topic.link + '" target="_blank" rel="noopener">อ่านเพิ่มเติมจาก Microsoft →</a>'
    : '';

  el.innerHTML =
    '<h2>' + topic.title + '</h2>' +
    videoSectionHtml +
    '<div class="section-label">คำบรรยายสรุป (ภาษาไทย)</div>' + textHtml + linkHtml +
    imagesHtml;
}

renderTopicList();
renderContent();
</script>
</body>
