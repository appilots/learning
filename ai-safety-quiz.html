    ], correct: 0 },

    choices: [

      { th: "แจ้งทีม IT หรือผู้ดูแลระบบของบริษัททันที", ja: "直ちにIT部門または会社のシステム管理者に報告する", en: "Notify IT or the company's system administrator immediately" },
      { th: "รอดูสถานการณ์ก่อนสัก 1 สัปดาห์", ja: "1週間ほど様子を見る", en: "Wait about a week to see how things develop" },
      { th: "ลบบทสนทนาทิ้งแล้วไม่บอกใคร", ja: "会話を削除して誰にも伝えない", en: "Delete the conversation and tell no one" }
    ], correct: 1 }
];

const PASS_RATIO = 0.9;
let current = 0;
const answers = new Array(QUESTIONS.length).fill(null);
let finished = false;
let started = false;
let TAKER_NAME = "";
let TAKER_EMAIL = "";
let emailAutoFired = false;

function letterFor(i) { return String.fromCharCode(65 + i); }

function setLang(lang) {
  LANG = lang;
  localStorage.setItem(LANG_KEY, lang);
  renderChrome();
  if (!started) renderStartGate();
  else if (finished) renderResults();
  else renderQuestion();
}

function renderStartGate() {
  started = false;
  finished = false;
  const t = UI[LANG];
  document.getElementById("progressWrap").style.display = "none";
  const el = document.getElementById("content");
  el.innerHTML =
    '<p class="start-gate-title">' + t.startTitle + '</p>' +
    '<p class="start-gate-hint">' + t.startHint + '</p>' +
    '<div class="start-gate-row">' +
    '<input type="text" class="notify-input" id="takerName" placeholder="' + t.namePlaceholder + '" aria-label="' + t.nameLabel + '" value="' + TAKER_NAME.replace(/"/g, "&quot;") + '">' +
    '<input type="email" class="notify-input" id="takerEmail" placeholder="' + t.emailFieldPlaceholder + '" aria-label="' + t.emailFieldLabel + '" value="' + TAKER_EMAIL.replace(/"/g, "&quot;") + '">' +
    '<button class="btn btn-primary" id="btnStart" disabled>' + t.startBtn + '</button>' +
    '</div>' +
    '<p class="notify-hint" id="startEmailError" style="display:none;color:var(--warn)">' + t.emailFieldInvalid + '</p>';

  const nameInput = document.getElementById("takerName");
  const emailInput = document.getElementById("takerEmail");
  const startBtn = document.getElementById("btnStart");
  const errEl = document.getElementById("startEmailError");
  const emailValid = () => /^[^\s@]+@attg\.co\.th$/i.test(emailInput.value.trim());
  const sync = () => {
    const ok = nameInput.value.trim().length > 0 && emailValid();
    startBtn.disabled = !ok;
    errEl.style.display = emailInput.value.trim().length > 0 && !emailValid() ? "" : "none";
  };
  nameInput.oninput = sync;
  emailInput.oninput = sync;
  nameInput.onkeydown = (e) => { if (e.key === "Enter" && !startBtn.disabled) startBtn.click(); };
  emailInput.onkeydown = (e) => { if (e.key === "Enter" && !startBtn.disabled) startBtn.click(); };
  sync();
  startBtn.onclick = () => {
    const name = nameInput.value.trim();
    if (!name || !emailValid()) return;
    TAKER_NAME = name;
    TAKER_EMAIL = emailInput.value.trim();
    started = true;
    document.getElementById("progressWrap").style.display = "";
    renderQuestion();
  };
}

function renderLangSwitch() {
  const el = document.getElementById("langSwitch");
  el.innerHTML = "";
  ["th", "ja", "en"].forEach(l => {
    const btn = document.createElement("button");
    btn.className = "lang-btn" + (l === LANG ? " active" : "");
    btn.textContent = (l === "th" ? "🇹🇭 " : l === "ja" ? "🇯🇵 " : "🇬🇧 ") + UI[l].langName;
    btn.setAttribute("aria-pressed", l === LANG ? "true" : "false");
    btn.onclick = () => setLang(l);
    el.appendChild(btn);
  });
}

function renderChrome() {
  const t = UI[LANG];
  renderLangSwitch();
  document.getElementById("mastheadH1").textContent = t.h1;
  document.getElementById("mastheadSub").textContent = t.sub;
  document.getElementById("backLink").textContent = t.backLink;
  document.title = t.h1.replace(/^\S+\s/, "") + " — ATTG";
}

function updateProgress() {
  const t = UI[LANG];
  const answeredCount = answers.filter(a => a !== null).length;
  document.getElementById("progQLabel").textContent = t.qOf(finished ? QUESTIONS.length : current + 1, QUESTIONS.length);
  document.getElementById("progALabel").textContent = t.answered(answeredCount);
  const pct = finished ? 100 : Math.round((current / QUESTIONS.length) * 100);
  document.getElementById("progFill").style.width = pct + "%";
}

function renderQuestion() {
  finished = false;
  const t = UI[LANG];
  const el = document.getElementById("content");
  const item = QUESTIONS[current];
  const picked = answers[current];

  const choicesHtml = item.choices.map((c, i) => {
    const sel = picked === i ? " selected" : "";
    return '<button class="choice' + sel + '" data-idx="' + i + '" aria-pressed="' + (picked === i) + '">' +
      '<span class="choice-letter">' + letterFor(i) + '</span><span>' + c[LANG] + '</span></button>';
  }).join('');

  el.innerHTML =
    '<span class="q-num">' + item.topic[LANG] + ' · ' + t.qOf(current + 1, QUESTIONS.length) + '</span>' +
    '<p class="q-text">' + item.q[LANG] + '</p>' +
    '<div class="choices">' + choicesHtml + '</div>' +
    '<div class="quiz-nav">' +
    '<button class="btn btn-ghost" id="btnPrev"' + (current === 0 ? ' disabled' : '') + '>' + t.prev + '</button>' +
    '<button class="btn btn-primary" id="btnNext"' + (picked === null ? ' disabled' : '') + '>' +
    (current === QUESTIONS.length - 1 ? t.submit : t.next) + '</button>' +
    '</div>';

  el.querySelectorAll(".choice").forEach(btn => {
    btn.onclick = () => {
      answers[current] = parseInt(btn.dataset.idx, 10);
      renderQuestion();
      updateProgress();
    };
  });
  document.getElementById("btnPrev").onclick = () => { current--; renderQuestion(); updateProgress(); };
  document.getElementById("btnNext").onclick = () => {
    if (current === QUESTIONS.length - 1) { renderResults(); }
    else { current++; renderQuestion(); updateProgress(); }
  };
  updateProgress();
}

function renderResults() {
  finished = true;
  const t = UI[LANG];
  const total = QUESTIONS.length;
  const correctCount = QUESTIONS.reduce((sum, item, i) => sum + (answers[i] === item.correct ? 1 : 0), 0);
  const pct = Math.round((correctCount / total) * 100);
  const passed = correctCount / total >= PASS_RATIO;

  const reviewHtml = QUESTIONS.map((item, i) => {
    const isRight = answers[i] === item.correct;
    return '<div class="review-item ' + (isRight ? 'right' : 'wrong') + '">' +
      '<p class="review-q">' + (i + 1) + '. ' + item.q[LANG] + '</p>' +
      (isRight
        ? '<p class="review-line correct"><span class="tag">' + t.yourAnswer + '</span>' + item.choices[answers[i]][LANG] + ' ✓</p>'
        : '<p class="review-line picked"><span class="tag">' + t.yourAnswer + '</span>' + (answers[i] === null ? t.notAnswered : item.choices[answers[i]][LANG]) + ' ✗</p>' +
          '<p class="review-line correct"><span class="tag">' + t.correctAnswer + '</span>' + item.choices[item.correct][LANG] + '</p>') +
      '</div>';
  }).join('');

  const notifyBoxHtml = passed
    ? (() => {
        const date = new Date().toLocaleDateString(LANG === "th" ? "th-TH" : LANG === "ja" ? "ja-JP" : "en-US");
        const subject = t.emailSubject(TAKER_NAME, pct);
        const body = t.emailBody(TAKER_NAME, TAKER_EMAIL, correctCount, total, pct, date);
        const mailtoUrl = "mailto:" + NOTIFY_EMAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
        return '<div class="notify-box">' +
          '<p class="notify-label">' + t.emailBtn.replace(/^\S+\s/, "") + '</p>' +
          '<p class="notify-auto-note">' + t.emailHint + '</p>' +
          '<div class="notify-row"><a class="btn btn-primary" href="' + mailtoUrl + '">' + t.emailBtn + '</a></div>' +
          '</div>';
      })()
    : '';

  const el = document.getElementById("content");
  el.innerHTML =
    '<div class="result-banner' + (passed ? '' : ' fail') + '">' +
    '<div class="result-score">' + correctCount + '/' + total + '</div>' +
    '<p class="result-verdict">' + (passed ? t.passVerdict(pct) : t.failVerdict(pct)) + '</p>' +
    '<p class="result-note">' + (passed ? t.passNote : t.failNote) + '</p></div>' +
    notifyBoxHtml +
    '<div class="result-actions">' +
    '<button class="btn btn-primary" id="btnRetry">' + t.retry + '</button>' +
    '<a class="btn btn-ghost" href="' + GUIDE_URL + '">' + t.backReview + '</a>' +
    '</div>' +
    '<span class="q-num">' + t.perQuestion + '</span>' +
    reviewHtml;

  document.getElementById("btnRetry").onclick = () => {
    current = 0;
    answers.fill(null);
    finished = false;
    renderQuestion();
  };
  updateProgress();
}

renderChrome();
renderStartGate();
</script>
