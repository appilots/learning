function renderHeroIllustration(topic, idx) {
  const illo = TOPIC_ILLUSTRATIONS[topic.key];
  if (!illo) return "";
  return '<div class="hero-illo tone-' + illo.tone + '">' +
    '<svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + UI[LANG].illoAria + topic.title[LANG] + '">' + illo.svg + '</svg>' +
    '<span class="hero-illo-caption">FIG. ' + String(idx + 1).padStart(2, "0") + ' — ' + topic.title[LANG] + '</span>' +
    '</div>';
}

function renderParagraph(block) {
  if (block.type === "plain") return "<p>" + block[LANG] + "</p>";
  const meta = LABEL_META[block.type];
  const label = LABEL_TEXT[block.type][LANG];
  return '<div class="note note-' + meta.cls + '">' +
    '<span class="note-icon">' + meta.icon + '</span>' +
    '<div class="note-body"><span class="note-label">' + label + ':</span> ' + block[LANG] + '</div>' +
    '</div>';
}

let currentKey = TOPICS[0].key;

function setLang(lang) {
  LANG = lang;
  localStorage.setItem(LANG_KEY, lang);
  renderChrome();
  renderTopicList();
  renderContent();
}

function renderLangSwitch() {
  const el = document.getElementById("langSwitch");
  el.innerHTML = "";
  ["th", "ja", "en"].forEach(l => {
    const btn = document.createElement("button");
    btn.className = "lang-btn" + (l === LANG ? " active" : "");
    btn.textContent = (l === "th" ? "🇹🇭 " : l === "ja" ? "🇯🇵 " : "🇬🇧 ") + UI[l].langName;
    btn.setAttribute("aria-pressed", l === LANG ? "true" : "false");
    btn.onclick = () => setLang(l);
    el.appendChild(btn);
  });
}

function renderChrome() {
  const t = UI[LANG];
  renderLangSwitch();
  document.getElementById("statTopicsLabel").textContent = t.topics;
  document.getElementById("statPassLabel").textContent = t.passScore;
  document.getElementById("statTopics").textContent = TOPICS.length;
  document.getElementById("mastheadH1").textContent = t.h1;
  document.getElementById("mastheadSub").textContent = t.sub;
  document.getElementById("mastheadNote").innerHTML = t.note;
  document.getElementById("topCtaText").innerHTML = "<strong>" + t.topCtaStrong + "</strong>" + t.topCtaSub;
  document.getElementById("topCtaBtn").textContent = t.topCtaBtn;
  document.title = t.h1.replace(/^\S+\s/, "") + " — ATTG";
}

function renderTopicList() {
  const t = UI[LANG];
  const el = document.getElementById("topicList");
  el.setAttribute("aria-label", t.topics);
  el.innerHTML = "";
  TOPICS.forEach((topic, i) => {
    const btn = document.createElement("button");
    btn.className = "station" + (topic.key === currentKey ? " active" : "");
    btn.setAttribute("aria-current", topic.key === currentKey ? "true" : "false");

    const numWrap = document.createElement("span");
    numWrap.className = "station-num-wrap";
    const num = document.createElement("span");
    num.className = "station-num";
    num.textContent = String(i + 1).padStart(2, "0");
    numWrap.appendChild(num);

    const info = document.createElement("span");
    info.className = "station-info";
    info.innerHTML = '<span class="station-icon">' + (topic.icon || "") + '</span><span class="station-text"><span class="station-title">' + topic.title[LANG] + '</span></span>';

    btn.appendChild(numWrap);
    btn.appendChild(info);
    btn.onclick = () => {
      currentKey = topic.key;
      renderTopicList();
      renderContent();
    };
    el.appendChild(btn);
  });

  const cta = document.createElement("div");
  cta.className = "rail-cta";
  cta.innerHTML =
    '<p class="rail-cta-label">' + t.railCtaLabel + '</p>' +
    '<p>' + t.railCtaText + '</p>' +
    '<a href="' + QUIZ_URL + '" target="_blank" rel="noopener">' + t.railCtaBtn + '</a>';
  el.appendChild(cta);
}

function renderContent() {
  const t = UI[LANG];
  const idx = TOPICS.findIndex(x => x.key === currentKey);
  const topic = TOPICS[idx];
  const el = document.getElementById("content");

  let mediaHtml = '';
  if (topic.video) {
    const watchUrl = topic.video.replace('/embed/', '/watch?v=');
    const langBadge = LANG_BADGES[topic.videoLang]
      ? '<span class="lang-badge">' + LANG_BADGES[topic.videoLang] + '</span>'
      : '';
    const creditHtml = (topic.videoTitle || topic.videoAuthor)
      ? '<div class="video-credit">' + langBadge +
        (topic.videoTitle ? '<strong>' + topic.videoTitle + '</strong>' : t.thisVideo) +
        (topic.videoAuthor ? ' — ' + t.byChannel + ' ' + topic.videoAuthor : '') +
        ' · <a href="' + watchUrl + '" target="_blank" rel="noopener">' + t.watchOriginal + '</a></div>'
      : '';
    mediaHtml = '<span class="section-label">' + t.secVideo + '</span><div class="video-frame"><iframe src="' + topic.video + '" allowfullscreen loading="lazy"></iframe></div>' + creditHtml;
  } else if (topic.keyPoints && topic.keyPoints.length > 0) {
    mediaHtml = '<div class="field-notes"><div class="field-notes-title">' + t.secKeyPoints + '</div><ul>' +
      topic.keyPoints.map(k => '<li>' + k[LANG] + '</li>').join('') +
      '</ul></div>';
  }

  const paragraphs = topic.text || [];
  const paraHtml = paragraphs.map(renderParagraph);
  if (topic.flow && topic.flow.length > 0) {
    const flowHtml = '<div class="flow-strip">' + topic.flow.map((step, i) =>
      '<div class="flow-step"><span class="flow-step-idx">STEP ' + (i + 1) + '</span><span class="flow-glyph">' + step.icon + '</span><span class="flow-text">' + step.label[LANG] + '</span></div>' +
      (i < topic.flow.length - 1 ? '<span class="flow-connector">→</span>' : '')
    ).join('') + '</div>';
    paraHtml.splice(Math.min(1, paraHtml.length), 0, flowHtml);
  }
  const textHtml = '<div class="text-block">' + paraHtml.join('') + '</div>';

  const linkHtml = topic.link
    ? '<a class="sheet-ref-link" href="' + topic.link + '" target="_blank" rel="noopener">' + t.readMore + '</a>'
    : '';

  el.innerHTML =
    '<div class="sheet-head"><span class="sheet-ref">' + t.topicOf(idx + 1, TOPICS.length) + '</span><h2>' + topic.title[LANG] + '</h2></div>' +
    renderHeroIllustration(topic, idx) +
    mediaHtml +
    '<span class="section-label">' + t.secSummary + '</span>' + textHtml + linkHtml;
}

renderChrome();
renderTopicList();
renderContent();
</script>
